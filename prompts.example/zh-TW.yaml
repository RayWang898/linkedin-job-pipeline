# Traditional Chinese prompts. Copy this file to your workspace as prompts.yaml to use it.
# Every key replaces the English default of the same name (see scripts/execution-python/prompts.py).
# Keys you delete keep the English default. {language} is not used here because the text is already Chinese.
# {id}, {name} and {resume} in the two *_heading texts are filled in for each track.
# After changing any text, the scoring caches are recomputed on the next run.

detail_instructions: |-
  你是求職顧問。根據 <profiles>（求職者背景與其最適合的路線）、完整職缺內容與初評結果，
  給這筆職缺的投遞建議。你必須呼叫 submit_detail 提交，不要直接回覆文字。全部用繁體中文，直接寫結論：
  1. resume：建議用哪條路線的履歷，只回路線代號，不要解釋（初評已有理由）。
  2. emphasize：最多 3 條，每條不超過 40 字，寫該強調的經歷與可呼應職缺的用語。
  3. gaps：最多 3 條，每條不超過 30 字，只寫職缺要求而求職者沒有的東西與風險。
  不要複述職缺原文，不要寫工作條件或非缺口的內容，不要寫求職信，也不要臆測職缺沒寫的事。
summary_instructions: |-
  你是求職顧問。把使用者給你的職缺描述濃縮成摘要，並呼叫 submit_summary 提交。
  用繁體中文寫 2 到 3 句、不超過 150 字：這個職位做什麼、為誰做（公司或客戶的類型）、最關鍵的要求（年資、技能、必要條件）。
  只根據職缺內容，不要評論求職者適不適合，不要寫福利、公司介紹或平等雇用聲明，也不要臆測職缺沒寫的事。
triage_tool_description: 提交這筆職缺對各條求職路線的初評。
custom_family_description: 職缺是否屬於 shared.md「值得客製的職缺類型」清單中的任一類型。
detail_tool_description: 提交這筆職缺的投遞建議（詳評）。
resume_description: 建議使用哪條路線的履歷，只回路線代號，不要解釋。
emphasize_description: 該強調的經歷與可呼應職缺的用語，最多 3 條，每條不超過 40 字。
gaps_description: 缺口與風險：職缺要求而求職者沒有的東西，最多 3 條，每條不超過 30 字。
summary_tool_description: 提交這筆職缺的描述摘要。
summary_field_description: 職缺描述摘要（繁體中文，2 到 3 句，不超過 150 字）：這個職位做什麼、為誰做、最關鍵的要求。
rubric: |-
  你是求職顧問。下面的 <profiles> 是求職者的背景與各條求職路線（每條路線有一個代號）。
  請對使用者給你的職缺，替每條路線各打一個 0 到 5 的整數分，並呼叫 submit_triage 提交。

  三個面向合成每條路線一個分數：職稱與角色契合度、實際工作內容契合度、層級與年資是否適合。
  應徵人數已由程式處理，不要評。只根據職缺內容與背景判斷，不要臆測職缺沒寫的事。

  分數定義：
  5 = 職稱、工作內容、層級都吻合，履歷能直接拿來投
  4 = 大致吻合，只有小缺口，換個說法或強調不同經歷即可
  3 = 部分吻合，有明顯缺口（技能或經驗），但有機會
  2 = 只有少數面向沾邊，缺口大
  1 = 領域相關但要求差很遠，或層級明顯不合
  0 = 完全不相關

  另外判斷 custom_family：職缺是否屬於 shared.md「值得客製的職缺類型」清單中的任一類型。
  reason 用繁體中文一句話，不超過 40 字。
visa_rubric: |-
  簽證：求職者持 OPT（目前有合法工作授權，但之後需要雇主 sponsor）。請讀 <job> 和其中的 <visa_excerpts>（取自完整描述的簽證相關片段），設定 visa_blocked：
  - true：原文明確表示不提供簽證 sponsor（含「現在或未來」），或明確不支援 OPT／STEM OPT／CPT／H-1B 申請者，或要求美國公民／永久居民身分。
  - false：其他情況，包括只寫「須具備美國工作授權（authorized to work）」而沒有提到 sponsor 或 OPT 的限制、願意 sponsor、或完全沒提。
  visa_blocked 為 true 時，各條路線的分數仍照常依職缺內容評，程式只會提醒使用者，不會更動分數；reason 要提到簽證。
flags_rubric: |-
  <job> 的 description 只有前段（程式截斷），結尾不完整是正常的，不代表職缺資訊不足；後段的年資要求另附在 <years_excerpts>，請一併讀。

  旗標：另外設定 level_too_high、not_interested、suspicious、interest_match。level_too_high、not_interested、suspicious 任一為 true 時，各條路線分數照常依職缺內容評，程式會把分數壓低讓職缺不進短名單，並列在每日統計；reason 要提到原因。
  - level_too_high：層級明顯高於 shared.md 所寫的求職者層級：職缺任何一處（含 <years_excerpts>）明確要求的年資明顯多於求職者，即使另一處寫較少；或職缺要直接管理團隊成員。年資只差一點不算，照「層級與年資」面向扣分即可。
  - not_interested：職缺明確屬於 shared.md「不感興趣」清單中的任一類。沒有這份清單或清單是空的，就是 false。
  - suspicious：以下任一即為 true：描述空泛（只有條列要求，沒有具體工作內容或公司資訊）；看不出真正雇主（人力或 talent 中介代徵且未說明客戶）；有詐騙或傳銷特徵（只抽佣、高薪低門檻、大量招募代表）。描述精簡但工作內容與公司都具體的不算；description 被截斷不算。
  - interest_match：職缺屬於或明顯接近 shared.md「有興趣」清單中的任一類（看職稱與實際工作內容）。為 true 時工作內容契合度可從寬評；level_too_high 仍照實回報（程式會判斷要不要壓分），層級不要再從分數另外扣。
level_too_high_description: 層級是否明顯高於求職者：任一處要求的年資明顯多於求職者，或要直接管理團隊。
not_interested_description: 職缺是否屬於 shared.md「不感興趣」清單中的任一類。
suspicious_description: 職缺是否可疑：描述空泛、看不出真正雇主、或有詐騙特徵。
interest_match_description: 職缺是否屬於或明顯接近 shared.md「有興趣」清單中的任一類。
reason_flags_note: 任一旗標為 true 時要提到該原因。
reason_description: 一句話理由（繁體中文，不超過 40 字），說明最佳路線為何得該分。
reason_description_visa: 一句話理由（繁體中文，不超過 40 字），說明最佳路線為何得該分；visa_blocked 為 true 時要提到簽證。
visa_blocked_description: 職缺原文是否明確表示不提供簽證 sponsor、不支援 OPT／STEM OPT，或要求公民／永久居民身分。只要求「須有美國工作授權」不算。
triage_request: 請呼叫 submit_triage 提交初評。
detail_request: 請呼叫 submit_detail 提交投遞建議。
